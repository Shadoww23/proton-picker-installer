name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on Ubuntu 20.04 Python
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:20.04 \
            bash -c "apt-get update -qq && apt-get install -y -qq python3 >/dev/null && python3 -m unittest discover -s tests -v"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: ./build/build_appimage.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: python -m pip install --disable-pip-version-check "pillow==10.4.0"
      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm
      - name: Build deb and rpm packages
        run: ./build/build_packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ProtonPickerSetup
          path: |
            dist/ProtonPickerSetup-*.AppImage
            dist/SHA256SUMS
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS-packages
