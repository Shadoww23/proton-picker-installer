name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: ./build/build_appimage.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ProtonPickerSetup-*.AppImage dist/SHA256SUMS \
            --title "Proton Picker Setup $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "AppImage setup for Proton Picker 0.1.0-alpha. Alpha: not validated on SteamOS. Downloads the official archive and verifies its SHA-256."
