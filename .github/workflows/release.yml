name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: ./build/build_appimage.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: python -m pip install --disable-pip-version-check "pillow==10.4.0"
      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm
      - name: Build deb and rpm packages
        run: ./build/build_packages.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ProtonPickerSetup-*.AppImage dist/SHA256SUMS \
            dist/packages/*.deb dist/packages/*.rpm dist/packages/SHA256SUMS-packages \
            --title "Proton Picker Setup $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Setup for Proton Picker 0.1.0-alpha, as an AppImage plus Debian/Ubuntu and Fedora packages. Alpha: not validated on SteamOS. Downloads the official archive and verifies its SHA-256."
