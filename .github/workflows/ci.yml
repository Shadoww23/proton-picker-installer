name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on Ubuntu 20.04 Python
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:20.04 \
            bash -c "apt-get update -qq && apt-get install -y -qq python3 >/dev/null && python3 -m unittest discover -s tests -v"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: ./build/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ProtonPickerSetup
          path: |
            dist/ProtonPickerSetup-*.AppImage
            dist/SHA256SUMS
